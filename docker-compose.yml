version: "3.9"

services:
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: naufalfahrezy/reactflask-backend:latest
    container_name: reactflask-backend
    environment:
      # Hindari FLASK_ENV (sudah deprecated). Debug only untuk lokal.
      FLASK_APP: api.py
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: 5000
      FLASK_DEBUG: "1"
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: naufalfahrezy/reactflask-frontend:latest
    container_name: reactflask-frontend
    # Frontend image-mu menyajikan lewat Apache/httpd di port 80 (bukan 3000 di dalam container),
    # jadi kita map 3000 (host) -> 80 (container).
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: reactflask-net
